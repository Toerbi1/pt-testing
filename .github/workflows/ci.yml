name: CI

# Runs the Group 4 (Returning & Availability) test suite automatically
# on every push to the main branch and on every pull request targeting it.
on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  # ── Fast feedback: unit, API and integration tests (Vitest) ──────────────────
  test:
    name: Unit / API / Integration (Vitest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm run test:unit

      - name: Run API tests
        run: npm run test:api

      - name: Run integration tests
        run: npm run test:integration

  # ── Browser end-to-end tests (Playwright) ────────────────────────────────────
  e2e:
    name: End-to-End (Playwright)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run E2E tests
        # playwright.config.js (re-)seeds the DB and starts the server itself.
        run: npm run test:e2e

      - name: Upload Playwright HTML report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Upload Playwright test-results (traces, screenshots, videos)
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          retention-days: 14
          # Only created when a test fails/retries — don't fail the step otherwise.
          if-no-files-found: ignore
